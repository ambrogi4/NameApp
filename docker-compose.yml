version: '3.8'
services:
  db_work:
    image: postgres:13
    volumes:
      - postgres_work:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp

  backend_work:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db_work
    environment:
      - DATABASE_URL=postgresql://user:password@db_work:5432/nameapp
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM Work
      - INSTANCE_COLOR=#F5A623

  db_charity:
    image: postgres:13
    volumes:
      - postgres_charity:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp_charity

  backend_charity:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5000"
    depends_on:
      - db_charity
    environment:
      - DATABASE_URL=postgresql://user:password@db_charity:5432/nameapp_charity
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM Charity
      - INSTANCE_COLOR=#87CEEB

  db_atc:
    image: postgres:13
    volumes:
      - postgres_atc:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp_atc

  backend_atc:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5002:5000"
    depends_on:
      - db_atc
    environment:
      - DATABASE_URL=postgresql://user:password@db_atc:5432/nameapp_atc
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM ATC
      - INSTANCE_COLOR=#9C27B0

  db_test:
    image: postgres:13
    volumes:
      - postgres_test:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp_test

  backend_test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5003:5000"
    depends_on:
      - db_test
    environment:
      - DATABASE_URL=postgresql://user:password@db_test:5432/nameapp_test
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM Test
      - INSTANCE_COLOR=#4CAF50

volumes:
  postgres_work:
  postgres_charity:
  postgres_atc:
  postgres_test:
