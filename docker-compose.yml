version: '3.8'
services:
  db_work:
    image: postgres:13
    volumes:
      - postgres_work:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp

  backend_work:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db_work
    environment:
      - DATABASE_URL=postgresql://user:password@db_work:5432/nameapp
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM Work
      - INSTANCE_COLOR=#F5A623

  db_charity:
    image: postgres:13
    volumes:
      - postgres_charity:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nameapp_charity

  backend_charity:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5000"
    depends_on:
      - db_charity
    environment:
      - DATABASE_URL=postgresql://user:password@db_charity:5432/nameapp_charity
      - FLASK_APP=app.py
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INSTANCE_NAME=myCRM Charity
      - INSTANCE_COLOR=#87CEEB

volumes:
  postgres_work:
  postgres_charity:
